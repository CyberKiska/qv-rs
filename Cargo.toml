[workspace]
members = ["crates/qvault-core", "crates/qvault-cli"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "GPL-3.0-only"
version = "0.2.0"

[workspace.dependencies]
aes-gcm = { version = "0.10.3", default-features = false, features = ["aes", "alloc"] }
anyhow = "1.0.102"
base64 = "0.22.1"
clap = { version = "4.6.1", features = ["derive"] }
crc32fast = "1.5.0"
ed25519-dalek = { version = "2.2.0", default-features = false, features = ["fast", "std", "zeroize"] }
fips203 = { version = "0.4.3", default-features = false, features = ["ml-kem-1024"] }
fips204 = { version = "0.4.6", default-features = false, features = ["ml-dsa-44", "ml-dsa-65", "ml-dsa-87"] }
fips205 = { version = "0.4.1", default-features = false, features = ["slh_dsa_shake_128s", "slh_dsa_shake_192s", "slh_dsa_shake_256s", "slh_dsa_shake_256f"] }
getrandom = "0.4.2"
hex = "0.4.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "0.10.9"
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["formatting", "macros", "parsing"] }
tiny-keccak = { version = "2.0.2", features = ["sha3", "kmac"] }
zeroize = { version = "1.8.2", features = ["zeroize_derive"] }
