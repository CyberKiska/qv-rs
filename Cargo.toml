[workspace]
members = ["crates/qvault-core", "crates/qvault-cli"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "GPL-3.0-only"
version = "0.1.0"

[workspace.dependencies]
aes-gcm = "0.10.3"
anyhow = "1.0.97"
clap = { version = "4.5.32", features = ["derive"] }
fips203 = { version = "0.4.3", default-features = false, features = ["default-rng", "ml-kem-1024"] }
getrandom = "0.2.15"
hex = "0.4.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
time = { version = "0.3.39", features = ["formatting", "macros", "parsing"] }
tiny-keccak = { version = "2.0.2", features = ["sha3", "kmac"] }
zeroize = { version = "1.8.1", features = ["zeroize_derive"] }
