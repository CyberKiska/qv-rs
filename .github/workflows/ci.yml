# CI: lint, test, and supply-chain checks on one Ubuntu runner; release binaries only on non-PR pushes.

name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_DENY_VERSION: 0.20.2
  QV_ORACLE_REPOSITORY: CyberKiska/quantum-vault
  QV_ORACLE_REVISION: 485a51388d0d26ee6cae9cd4785753a12eee9d32
  # SHA-256 of EmbarkStudios/cargo-deny asset `cargo-deny-${CARGO_DENY_VERSION}-x86_64-unknown-linux-musl.tar.gz` (update when bumping CARGO_DENY_VERSION).
  CARGO_DENY_LINUX_MUSL_SHA256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f

jobs:
  test:
    name: Checks (ubuntu-latest)
    runs-on: ubuntu-latest
    outputs:
      rust_version: ${{ steps.rust-toolchain.outputs.version }}
      package_version: ${{ steps.package-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Parse Rust channel from rust-toolchain.toml
        id: rust-toolchain
        shell: bash
        run: |
          set -euo pipefail
          v=$(grep -E '^[[:space:]]*channel[[:space:]]*=' rust-toolchain.toml | head -1 | sed 's/.*"\([^"]*\)".*/\1/')
          if [[ -z "${v}" ]]; then
            echo "Could not parse channel from rust-toolchain.toml"
            exit 1
          fi
          echo "version=${v}" >> "${GITHUB_OUTPUT}"

      - name: Cache Cargo registry and git sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-rust-${{ steps.rust-toolchain.outputs.version }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ steps.rust-toolchain.outputs.version }}-cargo-

      - name: Install Rust (${{ steps.rust-toolchain.outputs.version }})
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.3 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install "${{ steps.rust-toolchain.outputs.version }}" --profile minimal --no-self-update
          rustup default "${{ steps.rust-toolchain.outputs.version }}"
          rustup component add --toolchain "${{ steps.rust-toolchain.outputs.version }}" rustfmt clippy
          rustup target add --toolchain "${{ steps.rust-toolchain.outputs.version }}" i686-unknown-linux-gnu
          rustc -vV
          cargo -vV
          rustfmt -V
          cargo clippy -V

      - name: Resolve package version
        id: package-version
        shell: bash
        run: |
          set -euo pipefail
          v="$(cargo metadata --locked --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "qvault-cli") | .version')"
          if [[ -z "${v}" || "${v}" == "null" ]]; then
            echo "Invalid qvault-cli package version: ${v}"
            exit 1
          fi
          echo "version=${v}" >> "${GITHUB_OUTPUT}"

      - name: Install cargo-deny (pinned musl binary, no cargo install)
        shell: bash
        env:
          V: ${{ env.CARGO_DENY_VERSION }}
          EXPECT_SHA: ${{ env.CARGO_DENY_LINUX_MUSL_SHA256 }}
        run: |
          set -euo pipefail
          cargo_deny="${HOME}/.cargo/bin/cargo-deny"
          base="https://github.com/EmbarkStudios/cargo-deny/releases/download/${V}"
          name="cargo-deny-${V}-x86_64-unknown-linux-musl"
          tgz="${name}.tar.gz"
          mkdir -p "${HOME}/.cargo/bin"
          tmp="$(mktemp -d)"
          trap 'rm -rf "${tmp}"' EXIT
          cd "${tmp}"
          curl -fsSL --proto '=https' --tlsv1.2 "${base}/${tgz}" -o "${tgz}"
          echo "${EXPECT_SHA}  ${tgz}" | sha256sum -c -
          tar -xzf "${tgz}"
          install -m 0755 "${name}/cargo-deny" "${cargo_deny}"
          actual="$("${cargo_deny}" --version)"
          if [[ "${actual}" != "cargo-deny ${V}" ]]; then
            echo "Unexpected cargo-deny version: ${actual}"
            exit 1
          fi
          echo "${actual}"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Supply chain (duplicates, advisories, sources)
        run: |
          set -euo pipefail
          cargo tree --workspace --locked --edges normal --duplicates
          cargo deny check advisories sources

      - name: Clippy (warnings denied) and test workspace
        run: |
          set -euo pipefail
          cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
          cargo test --workspace --all-targets --all-features --locked

      - name: Check 32-bit integer-width portability
        run: cargo check --workspace --all-targets --locked --target i686-unknown-linux-gnu

  oracle-parity:
    name: Pinned JavaScript oracle parity
    runs-on: ubuntu-latest
    needs: test
    env:
      RUST_VERSION: ${{ needs.test.outputs.rust_version }}
    steps:
      - name: Checkout Rust implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: qv-cli

      - name: Checkout pinned JavaScript oracle
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.QV_ORACLE_REPOSITORY }}
          ref: ${{ env.QV_ORACLE_REVISION }}
          path: quantum-vault
          persist-credentials: false

      - name: Verify exact oracle revision
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git -C quantum-vault rev-parse HEAD)"
          test "${actual}" = "${QV_ORACLE_REVISION}"

      - name: Install Rust
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.3 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install "${RUST_VERSION}" --profile minimal --no-self-update
          rustup default "${RUST_VERSION}"

      - name: Compare mirrored corpus bytes with pinned oracle
        working-directory: qv-cli
        env:
          QV_ORACLE_ROOT: ${{ github.workspace }}/quantum-vault
        run: cargo test -p qvault-core --locked --test corpus_oracle_parity corpus_bytes_match_oracle_when_qv_oracle_root_set -- --ignored --exact

  fuzz:
    name: Parser fuzz smoke
    runs-on: ubuntu-latest
    needs: test
    env:
      RUST_VERSION: ${{ needs.test.outputs.rust_version }}
      CARGO_FUZZ_VERSION: 0.13.1
      FUZZ_NIGHTLY: nightly-2026-08-01
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Cargo registry, git sources, and fuzz builds
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/target
          key: ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-fuzz-${{ hashFiles('Cargo.lock', 'fuzz/Cargo.lock') }}

      - name: Install Rust and cargo-fuzz
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.3 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install "${RUST_VERSION}" --profile minimal --no-self-update
          rustup default "${RUST_VERSION}"
          cargo install cargo-fuzz --locked --version "${CARGO_FUZZ_VERSION}"

      - name: Install pinned nightly for scheduled sanitizer run
        if: github.event_name == 'schedule'
        run: rustup toolchain install "${FUZZ_NIGHTLY}" --profile minimal --no-self-update

      - name: Exercise all untrusted-input fuzz targets
        shell: bash
        env:
          RUN_KIND: ${{ github.event_name == 'schedule' && 'scheduled' || 'smoke' }}
        run: |
          set -euo pipefail
          corpus_root="$(mktemp -d)"
          trap 'rm -rf "${corpus_root}"' EXIT
          if [[ "${RUN_KIND}" == "scheduled" ]]; then
            fuzz_flags=(-max_total_time=60 -timeout=10 -rss_limit_mb=2048 -print_final_stats=1)
          else
            fuzz_flags=(-runs=1)
          fi
          run_target() {
            local target="$1"
            shift
            mkdir -p "${corpus_root}/${target}"
            if [[ "${RUN_KIND}" == "scheduled" ]]; then
              cargo "+${FUZZ_NIGHTLY}" fuzz run "${target}" "${corpus_root}/${target}" "$@" -- "${fuzz_flags[@]}"
            else
              cargo fuzz run "${target}" "${corpus_root}/${target}" "$@" --sanitizer none -- "${fuzz_flags[@]}"
            fi
          }
          run_target fuzz_qsig crates/qvault-core/tests/data/corpus/qsig
          run_target fuzz_pqpk crates/qvault-core/tests/data/corpus/pqpk
          run_target fuzz_qenc_header crates/qvault-core/tests/data/qenc_interop/single-small crates/qvault-core/tests/data/qenc_interop/chunked-large crates/qvault-core/tests/data/split_v7
          run_target fuzz_qvqcont7_shard crates/qvault-core/tests/data/corpus/qcont
          run_target fuzz_lifecycle_bundle crates/qvault-core/tests/data/schema/fixtures
          run_target fuzz_restore_selection crates/qvault-core/tests/data/corpus/qcont crates/qvault-core/tests/data/examples/single crates/qvault-core/tests/data/examples/bundle

  build-release-linux-windows:
    name: Release binaries (Linux + Windows, ubuntu-latest)
    runs-on: ubuntu-latest
    needs: [test, oracle-parity, fuzz]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      RUST_VERSION: ${{ needs.test.outputs.rust_version }}
      PACKAGE_VERSION: ${{ needs.test.outputs.package_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Cargo registry and git sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-cargo-

      - name: Install Rust (${{ env.RUST_VERSION }})
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.3 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install "${RUST_VERSION}" --profile minimal --no-self-update
          rustup default "${RUST_VERSION}"
          rustup target add x86_64-unknown-linux-gnu
          rustup target add x86_64-pc-windows-gnu
          rustc -vV

      - name: Install Windows cross-linker (MinGW-w64)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y mingw-w64 zip

      - name: Build release (Linux GNU + Windows GNU)
        env:
          CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER: x86_64-w64-mingw32-gcc
        run: |
          set -euo pipefail
          cargo build --release -p qvault-cli --locked --target x86_64-unknown-linux-gnu
          cargo build --release -p qvault-cli --locked --target x86_64-pc-windows-gnu

      - name: Stage archives
        shell: bash
        run: |
          set -euo pipefail
          V="${PACKAGE_VERSION}"
          mkdir -p "stage-linux/qvault-cli" "stage-win/qvault-cli"
          cp "target/x86_64-unknown-linux-gnu/release/qvault-cli" README.md USAGE.md LICENSE "stage-linux/qvault-cli/"
          cp "target/x86_64-pc-windows-gnu/release/qvault-cli.exe" README.md USAGE.md LICENSE "stage-win/qvault-cli/"
          tar -czf "qvault-cli-${V}-x86_64-unknown-linux-gnu.tar.gz" -C stage-linux qvault-cli
          ( cd stage-win && zip -qr "../qvault-cli-${V}-x86_64-pc-windows-gnu.zip" qvault-cli )

      - name: Upload Linux archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qvault-cli-linux-x86_64-gnu
          path: qvault-cli-${{ env.PACKAGE_VERSION }}-x86_64-unknown-linux-gnu.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qvault-cli-windows-x86_64-gnu
          path: qvault-cli-${{ env.PACKAGE_VERSION }}-x86_64-pc-windows-gnu.zip
          if-no-files-found: error
          retention-days: 30

  build-release-macos:
    name: Release binaries (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: [test, oracle-parity, fuzz]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    env:
      RUST_VERSION: ${{ needs.test.outputs.rust_version }}
      PACKAGE_VERSION: ${{ needs.test.outputs.package_version }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Apple Silicon (aarch64); primary macOS artifact.
          - os: macos-latest
            name: macos-aarch64
            target: aarch64-apple-darwin
            binary: qvault-cli
          # Intel macOS runner (x86_64-apple-darwin).
          - os: macos-15-intel
            name: macos-x86_64
            target: x86_64-apple-darwin
            binary: qvault-cli
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Cargo registry and git sources
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-cargo-${{ hashFiles('**/Cargo.lock') }}-${{ matrix.target }}
          restore-keys: |
            ${{ runner.os }}-rust-${{ env.RUST_VERSION }}-cargo-

      - name: Install Rust (${{ env.RUST_VERSION }})
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.3 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install "${RUST_VERSION}" --profile minimal --no-self-update
          rustup default "${RUST_VERSION}"
          rustup target add "${{ matrix.target }}"
          rustc -vV

      - name: Build release (native ${{ matrix.target }})
        run: cargo build --release -p qvault-cli --locked --target "${{ matrix.target }}"

      - name: Stage archive
        shell: bash
        run: |
          set -euo pipefail
          V="${PACKAGE_VERSION}"
          T="${{ matrix.target }}"
          mkdir -p "stage/qvault-cli"
          cp "target/${T}/release/${{ matrix.binary }}" README.md USAGE.md LICENSE "stage/qvault-cli/"
          tar -czf "qvault-cli-${V}-${T}.tar.gz" -C stage qvault-cli

      - name: Upload macOS archive
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: qvault-cli-${{ matrix.name }}
          path: qvault-cli-${{ env.PACKAGE_VERSION }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 30
